name: Java CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the main project (runnerz)
      - name: Checkout runnerz
        uses: actions/checkout@v3

      # 2️⃣ Checkout the dependency project (event_managment)
      - name: Checkout event_managment
        uses: actions/checkout@v3
        with:
          repository: wafiben/event_managment
          path: event_managment

      # 3️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4️⃣ Build and install event_managment
      - name: Build and install event_managment
        run: |
          cd event_managment
          mvn clean install -DskipTests

      # 5️⃣ Build the main project (runnerz)
      - name: Build runnerz
        run: mvn clean install

      # 6️⃣ Run tests on runnerz
      - name: Run tests
        run: mvn test
