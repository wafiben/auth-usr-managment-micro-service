spring.application.name=runnerz

# Database - Different name for isolation
spring.datasource.url=jdbc:h2:mem:devdb  # devdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true  # ? Show SQL - helpful for debugging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true  # ? Pretty SQL

# H2 Console - Access database via browser
spring.h2.console.enabled=true  # ? Enabled - you can browse data
spring.h2.console.path=/h2-console

# Server
server.port=8081  # ? Fixed port - easy to remember

# JWT
jwt.secret=uTckAxECoV0HWovKGSnKhaLvk0wcIm+Eo/deoWm2iqlwQxR3f4MA1vY4XMHSE/yJH8kAZhiKdsgAc6tLRLANpQ==
jwt.expiration=86400000

# Error handling - Verbose for debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true  # ? Show exceptions
server.error.include-stacktrace=on_param  # ? Show stacktrace with ?trace=true